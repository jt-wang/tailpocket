<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web phone example</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  textarea, button { font: inherit; color: inherit; width: 100%; box-sizing: border-box; margin: .25rem 0; padding: .6rem .75rem;
    border: 0.5px solid color-mix(in srgb, currentColor 35%, transparent); border-radius: 8px; background: transparent; }
  button:disabled { opacity: .5; }
  textarea { min-height: 5rem; }
  video { width: 100%; display: none; }
</style>
</head>
<body>
<h1>Pair this browser with a computer</h1>
<p>Paste the pairing code the computer shows, or scan it.</p>
<textarea id="code" placeholder="tailpocket1:…"></textarea>
<button id="pair">Pair</button>
<button id="scan">Scan QR code</button>
<video id="video" playsinline muted></video>
<button id="fetch" disabled>Fetch /hello.txt from the computer</button>
<p id="out">Not paired.</p>
<script type="module">
  // The SDK files are served from this repository; a real app bundles sdk/web and dist/.
  import { loadTailPocket, scanTailPocketInvite } from '../../sdk/web/index.js';
  const $ = (id) => document.getElementById(id);
  const say = (text) => { $('out').textContent = text; };
  const tailPocket = await loadTailPocket();
  // A demo stores the link in localStorage; it holds the phone's private key.
  let link = JSON.parse(localStorage.getItem('tailPocket-link') || 'null');
  const key = localStorage.getItem('tailPocket-key') || tailPocket.newKey();
  localStorage.setItem('tailPocket-key', key);
  if (link) { $('fetch').disabled = false; say(`Paired with ${link.name}.`); }
  async function pair(text) {
    try {
      const invite = tailPocket.decodeInvite(tailPocket.tailPocketInviteText(text) ?? text);
      say(`Pairing with ${invite.name || 'the computer'}…`);
      link = await tailPocket.pair(invite, key, navigator.userAgentData?.platform || 'Browser');
      localStorage.setItem('tailPocket-link', JSON.stringify(link));
      $('fetch').disabled = false;
      say(`Paired with ${link.name}.`);
    } catch (e) { say(`Pairing failed: ${e.code ?? e.message}`); }
  }
  $('pair').onclick = () => pair($('code').value);
  $('scan').onclick = async () => {
    $('video').style.display = 'block';
    try { await pair(await scanTailPocketInvite({ video: $('video') })); }
    catch (e) { say(e.code === 'unsupported' ? 'This browser cannot scan QR codes; paste the code.' : `Scan failed: ${e.code ?? e.message}`); }
    finally { $('video').style.display = 'none'; }
  };
  $('fetch').onclick = async () => {
    say('Fetching…');
    try { const r = await tailPocket.fetch(link, '/hello.txt'); say(`${r.status}: ${await r.text()}`); }
    catch (e) { say(`Fetch failed: ${e.code ?? e.message}`); }
  };
</script>
</body>
</html>

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26 // react-native-tailpocket needs Android 8
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The Kotlin libraries from this repository: scripts/build-mobile.sh android, then ./gradlew publish
// in sdk/android. An app that gets them from a Maven repository leaves this out.
allprojects {
    repositories {
        maven { url = uri("$rootDir/../../../build/android/m2") }
    }
}
